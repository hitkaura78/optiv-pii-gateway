# Member 3 — Detection Configuration & Allow-list Rules
# All thresholds, structured ID patterns, table column header mappings,
# and allow-list suppressions with explicit reason codes live here.

detect:
  mask_threshold: 0.50
  strict_threshold: 0.30
  low_ocr_confidence_threshold: 0.70
  dob_context_window_chars: 25
  last4_context_window_chars: 30
  family_context_window_chars: 25
  min_unique_surname_length: 5
  phone_regions:
    - US
    - GB
    - IN
    - FR
    - PL
    - SG
    - SE
    - HK
  id_formats:
    EMPLOYEE_ID: 'EMP-\d{5}'
    DIRECTOR_ID: 'DIR-\d{4}'
    VENDOR_WORKER_ID: 'MER-[A-Z]{2}-\d{4}'

table_column_headers:
  EMPLOYEE_ID:
    - EMP ID
    - EMPLOYEE ID
    - STAFF ID
  DIRECTOR_ID:
    - DIR ID
    - DIRECTOR ID
  VENDOR_WORKER_ID:
    - VENDOR ID
    - MERCHANT ID
    - WORKER ID
  GOV_ID:
    - NATIONAL ID
    - GOV ID
    - GOVERNMENT ID
    - SSN
    - PESEL
    - PAN
  PHONE:
    - MOBILE
    - PHONE
    - TELEPHONE
    - CONTACT NO
    - WORK PHONE
  EMAIL:
    - E-MAIL
    - EMAIL
    - EMAIL ADDRESS
  PERSON:
    - FULL NAME
    - EMPLOYEE NAME
    - NAME
    - RESPONSIBLE
    - ACCOUNTABLE
    - CONSULTED
    - INFORMED
  DATE_OF_BIRTH:
    - DOB
    - DATE OF BIRTH
    - BIRTH DATE
  ADDRESS:
    - HOME ADDRESS
    - RESIDENTIAL ADDRESS

allowlist:
  reference_id_prefixes:
    INC-: ALLOW_REF_ID_INC
    LOS-: ALLOW_REF_ID_LOS
    RSK-: ALLOW_REF_ID_RSK
    CTL-: ALLOW_REF_ID_CTL
    GRP-: ALLOW_REF_ID_GRP
    SPK-: ALLOW_REF_ID_SPK
    ISS-: ALLOW_REF_ID_ISS

  generic_mailboxes:
    - pattern: '^(?:support|info|helpdesk|security|compliance|privacy|hr|noreply|no-reply|contact|legal|audit)@[A-Za-z0-9.-]+\.[A-Za-z0-9]{2,}$'
      reason: ALLOW_GENERIC_MAILBOX

  # TODO(Member-3): Populate real company_names, hq_addresses, and hotlines from
  # the actual sample documents once provided — do not invent values.
  company_names:
    # Not a sample value: Office writes its application name (e.g. "Microsoft Macintosh Word")
    # into docProps/app.xml of every document, where the name heuristic read it as a person.
    - value: Microsoft
      reason: ALLOW_COMPANY_NAME
  hq_addresses: []
  hotlines: []

  money_amounts:
    - pattern: '(?:[$€£¥₹]|(?:USD|EUR|GBP|INR|PLN)\s*)\d{1,3}(?:[,\s]\d{3})*(?:[.,]\d{2})?|\d{1,3}(?:[,\s]\d{3})*(?:[.,]\d{2})\s*(?:[$€£¥₹]|USD|EUR|GBP|INR|PLN)\b'
      reason: ALLOW_MONEY_AMOUNT

